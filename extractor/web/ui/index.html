<script>
/* theme before first paint: ?theme=, then the stored choice, else the OS preference (no class) */
(function () {
  var q = new URLSearchParams(location.search).get("theme"), t = null;
  try { t = localStorage.getItem("ds-theme"); } catch (e) { /* storage blocked */ }
  t = q === "dark" || q === "light" ? q : t;
  if (t === "dark" || t === "light") document.documentElement.classList.add(t);
})();
</script>
</head>
