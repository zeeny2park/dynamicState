<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dynamicState · 진단 (UI 목업)</title>
<link rel="stylesheet" href="theme.css">
<style>
/* ---- page-specific layout only; colors, radius, type and components come from theme.css ---- */
.top{position:sticky;top:0;z-index:10;background:color-mix(in oklch,var(--background) 88%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;gap:14px;padding:0 20px}
.brand{font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--info)}
.brand small{font-weight:400;color:var(--muted-foreground)}
.grow{flex:1}
.tchip{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted-foreground);min-width:0}
.tchip b{color:var(--foreground);font-family:var(--font-mono);font-weight:600}
.tchip .sep{color:var(--border)}
.tchip .live{display:inline-flex;align-items:center;gap:6px;color:var(--info)}
.tchip .live i{width:7px;height:7px;border-radius:50%;background:var(--info);animation:pulse 1.2s infinite}
main{max-width:920px;margin:0 auto;padding:22px 20px 120px;display:flex;flex-direction:column;gap:12px}
/* idle */
.hero{max-width:640px;margin:64px auto 0;text-align:center;display:flex;flex-direction:column;gap:8px}
.hero p{color:var(--muted-foreground);margin:0 0 14px}
.form{text-align:left;padding:12px;box-shadow:var(--shadow-md)}
.row{display:flex;gap:8px;align-items:center}
.row .input{flex:1}
.form .row+.row{margin-top:8px}
.opt{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--muted-foreground);padding:0 2px}
.recent{max-width:640px;margin:22px auto 0;width:100%}
.recent h3{font-size:12px;color:var(--muted-foreground);font-weight:500;margin:0 0 8px;letter-spacing:.04em;text-transform:uppercase}
.recent .it{display:flex;align-items:center;gap:12px;padding:9px 12px;margin-bottom:6px;font-size:13px}
.recent .it .n{font-family:var(--font-mono);font-weight:600}
.recent .it .t{color:var(--muted-foreground);margin-left:auto;white-space:nowrap}
/* banner */
.banner .line1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.banner .phase{color:var(--muted-foreground);font-size:12.5px}
.banner .elapsed{margin-left:auto;font-family:var(--font-mono);font-size:12.5px;color:var(--muted-foreground)}
.banner .sum{margin:10px 0 0;font-size:16px;line-height:1.5}
.banner .sum b{font-weight:600}
.phases{display:flex;gap:4px;margin-top:8px;font-size:11.5px;color:var(--muted-foreground)}
.phases span{flex:1;text-align:center;padding:4px 0 0;border-top:2px solid var(--border)}
.phases span.done{border-color:var(--foreground);color:var(--foreground)}
.phases span.now{border-color:var(--info);color:var(--info);font-weight:600}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tile{padding:10px 12px}
.tile .k{font-size:12px;color:var(--muted-foreground)}
.tile .v{font-size:20px;font-weight:600;letter-spacing:-.01em;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .v.pend{color:var(--border);font-weight:400}
.tile .s{font-size:11.5px;color:var(--muted-foreground);margin-top:2px}
.tile .progress-stack{margin-top:6px}
/* target */
.kv{display:grid;grid-template-columns:1.5fr 1fr;gap:7px 28px;font-size:13px}
.kv div{display:flex;gap:8px;align-items:baseline;min-width:0}
.kv .k{color:var(--muted-foreground);flex:none;width:84px;white-space:nowrap}
.kv .v{font-family:var(--font-mono);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* findings */
.fbody{display:grid;grid-template-columns:300px 1fr;gap:18px;margin-top:10px;align-items:start}
.svgbox{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:8px}
.steps{list-style:none;margin:0;padding:0;font-size:13px}
.steps li{display:flex;gap:10px;padding:6px 0;border-top:1px dashed var(--border)}
.steps li:first-child{border-top:0}
.steps .n{flex:none;width:20px;height:20px;border-radius:50%;background:var(--primary);color:var(--primary-foreground);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.steps .pend .n{background:var(--border);color:var(--muted-foreground)} .steps .pend{color:var(--muted-foreground)}
.obs,.rec{font-size:11px;padding:0 6px;border-radius:999px;border:1px solid currentColor;margin-left:4px}
.obs{color:var(--success)} .rec{color:var(--warning)}
.fbody .collapsible,.card-content>.collapsible{margin-top:12px}
/* checks */
.ck{list-style:none;margin:0;padding:0}
.ck li{display:flex;align-items:center;gap:10px;padding:7px 4px;border-top:1px solid var(--border);font-size:13px;cursor:pointer;border-radius:4px}
.ck li:first-child{border-top:0}
.ck li:hover{background:var(--accent)}
.ck .nm{font-weight:500;min-width:170px}
.ck .cat{color:var(--muted-foreground);font-size:12px;min-width:92px}
.ck .ln{color:var(--muted-foreground);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ck .ms{color:var(--muted-foreground);font-family:var(--font-mono);font-size:11.5px;flex:none;font-variant-numeric:tabular-nums}
.ck li.pend{color:var(--muted-foreground)} .ck li.pend .nm{font-weight:400}
.ck .dt{display:none;flex-basis:100%;padding:6px 0 6px 28px;font-size:13px;color:var(--foreground);cursor:default}
.ck li.open{flex-wrap:wrap} .ck li.open .dt{display:block}
/* lists */
.ul{margin:0;padding-left:18px;font-size:13.5px}
.ul li{margin:4px 0}
.ul li .why{color:var(--muted-foreground);font-size:12.5px}
/* report view (same cards, a masthead instead of the app header) */
body.report .top{display:none}
.masthead{padding:18px 22px}
.masthead h1{font-size:20px}
.masthead .meta{color:var(--muted-foreground);font-size:12.5px;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.masthead nav{display:flex;gap:14px;margin-top:10px;font-size:12.5px}
/* mock toolbar */
.mock{position:fixed;right:16px;bottom:16px;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:12px;padding:8px 10px;font-size:12px;
  display:flex;gap:6px;align-items:center;box-shadow:var(--shadow-md);z-index:50}
.mock b{margin-right:4px;font-weight:600}
.mock .btn[aria-pressed="true"]{background:var(--primary);color:var(--primary-foreground)}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}.fbody{grid-template-columns:1fr}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="dot"></span>dynamicState <small>진단</small></div>
  <div id="tchip" class="tchip hidden"></div>
  <div class="grow"></div>
  <button class="btn btn-ghost btn-sm" id="btn-new" title="다른 프로세스 진단">새 진단</button>
  <button class="btn btn-ghost btn-sm" id="btn-theme" title="밝게/어둡게" aria-label="테마 전환"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
  <button class="btn btn-ghost btn-sm">KO</button>
  <button class="btn btn-ghost btn-sm" title="스냅샷·상태 그래프·워치리스트 등 기존 도구 (레거시)">도구 ▾</button>
</header>

<main id="main"></main>

<div class="mock no-print" id="mock">
  <b>목업 단계</b>
  <button class="btn btn-outline btn-sm" data-s="0">0 대기</button><button class="btn btn-outline btn-sm" data-s="1">1 대상</button>
  <button class="btn btn-outline btn-sm" data-s="2">2 계획</button><button class="btn btn-outline btn-sm" data-s="3">3 수집</button>
  <button class="btn btn-outline btn-sm" data-s="4">4 검증</button><button class="btn btn-outline btn-sm" data-s="5">5 판정</button>
  <button class="btn btn-outline btn-sm" data-s="6">정상 사례</button>
  <button class="btn btn-outline btn-sm" id="btn-view">보고서 보기</button>
  <button class="btn btn-sm" id="play">▶ 재생</button>
</div>

<script>

   The renderer only ever ADDS information; nothing moves. */
const CHECKS = [
 ["프로세스 메모리 증가","메모리 증가","PASS","no growth trend (RSS +0 KB over 1.40 s, 6 samples)",1400],
 ["힙 증가","메모리 증가","PASS","Heap stable (delta=0 bytes)",310],
 ["파일 디스크립터 누수","프로그램 상태","PASS","open fds 3 → 3 → 3 over 0.8 s (+0, 0.0/s), limit 1048576",800],
 ["힙 메타데이터 무결성","메모리 무결성","PASS","heap metadata intact: 4 chunks walked, top chunk, free lists and bin links consistent",120],
 ["해제된 메모리 사용","메모리 무결성","PASS","no typed pointer refers to a free chunk and no free chunk was written: 0 free chunks",95],
 ["오래 막힌 스레드","스레드와 락","FAIL","Blocked threads: 2; 'ingest' (tid 3351225) stayed in pthread_mutex_lock for all 5 samples",630],
 ["교착 상태(대기 고리)","스레드와 락","FAIL","Cycle verified persistent across threads: ingest → flush → ingest",210],
 ["의심스러운 락 소유","스레드와 락","FAIL","Suspicious/circular mutex ownership detected: m_in owned by ingest, m_out owned by flush",140],
 ["스레드 상태 이상","스레드와 락","INCONCLUSIVE","검사가 사유를 기록하지 않았습니다.",60],
 ["해제 후 사용(추적 기반)","메모리 무결성","INCONCLUSIVE","여기서 사용할 수 없는 기능이 필요함: DYNAMIC_EVENT_TRACING",5],
];
const CHECKS_OK = [
 ["프로세스 메모리 증가","메모리 증가","PASS","no growth trend (RSS +12 KB over 6.0 s, 13 samples)",6000],
 ["힙 증가","메모리 증가","PASS","Heap stable (delta=+2,048 bytes, within noise)",420],
 ["파일 디스크립터 누수","프로그램 상태","PASS","open fds 41 → 41 → 42 → 41 over 3.0 s (+0, 0.0/s), limit 1048576",3000],
 ["힙 메타데이터 무결성","메모리 무결성","PASS","heap metadata intact: 1,912 chunks walked, 3 arenas, bin links consistent",380],
 ["해제된 메모리 사용","메모리 무결성","PASS","no typed pointer refers to a free chunk and no free chunk was written: 211 free chunks",260],
 ["오래 막힌 스레드","스레드와 락","PASS","no thread stayed blocked on one lock across 5 samples (9 threads)",640],
 ["교착 상태(대기 고리)","스레드와 락","PASS","no wait-for cycle among 9 threads / 4 mutexes",150],
 ["의심스러운 락 소유","스레드와 락","PASS","every owned mutex has a live owner; no orphan lock",90],
 ["스레드 상태 이상","스레드와 락","PASS","thread count 9 → 9, no zombie/unnamed worker growth",70],
 ["스핀 대기","스레드와 락","PASS","no thread above 90% CPU on an unchanging variable",520],
];
const SKIPPED = [["공유 상태 불일치","스레드와 락"],["이중 해제","메모리 무결성"],["잘못된 해제","메모리 무결성"],["잘못된 메모리 접근","메모리 무결성"],
 ["의심스러운 경계 값","메모리 무결성"],["널·잘못된 포인터","메모리 무결성"],["할당·해제 불균형","메모리 증가"],["오래 남는 객체 누적","메모리 증가"],
 ["객체 수명 이상","메모리 증가"],["반복 할당 패턴","메모리 증가"],["의심스러운 할당 패턴","메모리 증가"],["연관 변수 불일치","프로그램 상태"],
 ["상태 전이 위반","프로그램 상태"],["예상 밖 변수 변화","프로그램 상태"]];

let CUR = CHECKS;
const EV = [];
let t=0;
EV.push({t:0, type:"started", pid:"3351223", symptom:"서비스가 응답하지 않음"});
EV.push({t:350, type:"target", name:"deadlock_pipeli", pid:3351223, exe:"/opt/pipeline/bin/deadlock_pipeline", arch:"aarch64",
  buildid:"a1f3…9c2e (일치)", threads:3, debug:"DWARF 있음 (대상 실행 파일)", transport:"local · process_vm_readv", libc:"glibc 2.39"});
EV.push({t:700, type:"classified", category:"스레드와 락", hyps:["교착 상태","오래 막힌 스레드","스핀 대기"]});
EV.push({t:1000, type:"plan", run:CHECKS.length, skipped:SKIPPED.length, base:14, extra:1});
t=1000;
CHECKS.forEach((c,i)=>{ t+=120; EV.push({t, type:"check_start", i}); t+=Math.min(c[4],700); EV.push({t, type:"check_done", i});
  if(i===5) EV.push({t:t+10,type:"finding_provisional"});
  if(i===6) EV.push({t:t+10,type:"finding_cycle"});
});
EV.push({t:t+300,type:"analyzing"});
EV.push({t:t+900,type:"verified", reread:"2회 재읽기 일치", refuted:["스핀 대기 (CPU 0%, 모든 샘플 sleep)","오래 막힌 I/O (대기 대상이 뮤텍스)"]});
EV.push({t:t+1500,type:"verdict", verdict:"CONFIRMED_FAULT", conf:92, duration:"5.1 s", bytes:"162.8 KB", stop:"0 ms",
  summary:"<code>deadlock_pipeli</code> (pid 3351223)에서 확인된 문제가 있습니다: <b>교착 상태</b>. <code>ingest</code>(tid 3351225)가 락 <code>m_out</code>을 기다리고, <code>flush</code>(tid 3351226)가 락 <code>m_in</code>을 기다립니다.",
  next:[["락 획득 순서를 하나로 통일","<code>deadlock_pipeline.c:15</code>와 <code>:27</code>에서 <code>m_in</code>·<code>m_out</code>을 서로 반대 순서로 잡습니다."],
        ["즉시 복구가 필요하면 프로세스 재시작","두 스레드 모두 깨어날 수 없으므로 자연 회복은 없습니다."],
        ["재발 확인은 같은 명령으로","<code>dynamic-state diagnose 3351223</code>을 수정 배포 후 한 번 더 실행"]],
  nc:[["스레드 상태 이상 검사","검사가 사유를 기록하지 않아 판단하지 못함"],["해제 후 사용(추적 기반)","추적 모드(DYNAMIC_EVENT_TRACING)가 꺼져 있음. 이번 결론과는 무관"]]});
const STAGE = {0:0, 1:EV.findIndex(e=>e.type==="classified")+1, 2:EV.findIndex(e=>e.type==="plan")+1,
  3:EV.findIndex(e=>e.type==="finding_cycle")+1, 4:EV.findIndex(e=>e.type==="verified")+1, 5:EV.length};
const EV_OK = [
 {t:0,type:"started",pid:"41177",symptom:"(증상 없음 · 일반 점검)"},
 {t:350,type:"target",name:"ok_busy_server",pid:41177,exe:"/opt/svc/bin/ok_busy_server",arch:"aarch64",buildid:"7d02…41aa (일치)",threads:9,debug:"DWARF 있음 (대상 실행 파일)",transport:"local · process_vm_readv",libc:"glibc 2.39"},
 {t:700,type:"classified",category:"일반 점검",hyps:["메모리 증가","교착 상태","힙 손상","FD 누수"]},
 {t:1000,type:"plan",run:10,skipped:14,base:14,extra:0},
 {t:4000,type:"verdict",verdict:"HEALTHY",conf:88,duration:"6.4 s",bytes:"91.2 KB",stop:"0 ms",ok:true,
  summary:"<code>ok_busy_server</code> (pid 41177)에서 <b>기본 검사 14개 범위 안에서는 이상을 찾지 못했습니다.</b> 메모리는 6.4초 동안 안정적이었고, 막힌 스레드와 힙 손상은 없었습니다.",
  next:[["증상이 계속되면 증상을 적어 다시 실행","증상이 있으면 그에 맞는 추가 검사가 계획에 들어갑니다."],["장시간 추세는 반복 실행으로","느린 누수는 6초 창에서 보이지 않을 수 있습니다."]],
  nc:[["느린 메모리 증가 (수 분 이상)","관측 창 6.4 s"],["추적 기반 검사 3개","추적 모드가 꺼져 있음"]]},
];

/* ============================ renderer ============================ */
const $ = s=>document.querySelector(s);
const el = (h)=>{const d=document.createElement("div");d.innerHTML=h.trim();return d.firstElementChild;};
const Q = new URLSearchParams(location.search);
let VIEW = Q.get("view")==="report" ? "report" : "app";
let S;
function reset(){ S={started:false,target:null,cls:null,plan:null,checks:[],finding:null,verified:null,verdict:null,phase:"",elapsed:0}; $("#main").innerHTML=""; $("#tchip").classList.add("hidden"); document.body.classList.toggle("report", VIEW==="report"); }
const vword=v=>({CONFIRMED_FAULT:"확정 결함",PROBABLE_FAULT:"결함 가능",HEALTHY:"정상",INCONCLUSIVE:"판단 불가"}[v]||v);
function ensure(id,html,after){ let n=document.getElementById(id); if(n) return n; n=el(html); n.id=id; n.classList.add("rise");
  const m=$("#main"); const a=after&&document.getElementById(after); if(a) a.insertAdjacentElement("afterend",n); else m.appendChild(n); return n; }

function renderIdle(){
  $("#main").innerHTML = `
  <div class="hero">
    <h1>실행 중인 프로세스를 멈추지 않고 진단합니다</h1>
    <p>PID 하나면 됩니다. 결과는 이 화면에 진행되는 대로 쌓이고, 끝나면 그대로 보고서가 됩니다.</p>
    <div class="card form">
      <div class="row">
        <div class="toggle-group toggle-group-lg"><button aria-pressed="true">로컬</button><button aria-pressed="false">SSH</button></div>

      </div>
      <div class="row">
        <input class="input" placeholder="증상 (선택)  예: 서비스가 응답하지 않음, 메모리가 계속 늘어남">
        <input class="input mono" style="flex:.8" placeholder="디버그 ELF 경로 (선택 · 기본 /proc/PID/exe)">
      </div>
      <div class="opt"><span>읽기 전용 · 대상 정지 없음 · 기본 시간 예산 20 s</span><a href="#">고급 옵션</a></div>
    </div>
  </div>
  <div class="recent">
    <h3>최근 진단</h3>
    <div class="card it"><span class="badge badge-tone tone-fail">확정 결함</span><span class="n">deadlock_pipeli</span><span class="text-muted">교착 상태 · pid 3351223</span><span class="t">12분 전</span></div>

function apply(e){
  switch(e.type){
    case "started": S.started=e; S.phase="대상 확인"; break;
    case "target": S.target=e; S.phase="증상 분류"; break;
    case "classified": S.cls=e; S.phase="계획"; break;
    case "plan": S.plan=e; S.phase="수집"; S.checks=Array.from({length:Math.min(e.run,CUR.length)},()=>({st:"PENDING"})); break;
    case "check_start": S.checks[e.i].st="RUNNING"; break;
    case "check_done": S.checks[e.i].st=CUR[e.i][2]; break;
    case "finding_provisional": S.finding={cycle:false}; break;
    case "finding_cycle": S.finding={cycle:true}; break;
    case "analyzing": S.phase="분석·검증"; break;
    case "verified": S.verified=e; break;
    case "verdict": S.verdict=e; S.phase="판정"; if(e.ok){S.checks=S.checks.map(()=>({st:"PASS"}));} break;
  }
  S.elapsed=e.t;
}

$("#btn-theme").onclick=()=>{const r=document.documentElement; const dark=r.classList.contains("dark")||(!r.classList.contains("light")&&matchMedia("(prefers-color-scheme: dark)").matches); r.classList.toggle("dark",!dark); r.classList.toggle("light",dark);};
if(Q.get("theme")==="dark") document.documentElement.classList.add("dark"); else if(Q.get("theme")==="light") document.documentElement.classList.add("light");
if(VIEW==="report") $("#btn-view").textContent="앱 화면 보기";
jump(+(Q.get("stage")||0));
</script>
</body>
</html>
