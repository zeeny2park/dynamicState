name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb gcc g++ make

      - name: Build target collector and test fixtures
        run: |
          make -C target/collector
          g++ -fPIE -pie -g -O0 -fno-inline -fno-omit-frame-pointer -Wl,--build-id=sha1 tests/fixtures/real_runtime/main.cpp -o /tmp/real_runtime_app_debug.elf -lpthread
          strip -s -o /tmp/real_runtime_app_prod.stripped /tmp/real_runtime_app_debug.elf

      - name: Run Capture Safety and Diff Accuracy Tests
        run: |
          python3 -m unittest tests/test_capture_safety_and_diff_accuracy.py

      - name: Run Process Lifecycle and Seam Invariants Tests
        run: |
          python3 -m unittest tests/test_capture_lifecycle_seam.py

      - name: Run Real Runtime Validation Tests
        run: |
          python3 -m unittest tests/test_real_runtime_validation.py

      - name: Run End-to-End C++ Investigation Pipeline Tests
        run: |
          python3 -m unittest tests/test_cpp_e2e_investigation.py

      - name: Run Causal Validation and Evidence Authenticity Tests
        run: |
          python3 -m unittest tests/test_causal_validation_hardening.py

      - name: Run Security Gates and Independent Trust Verification Tests
        run: |
          python3 -m unittest tests/test_phase10_ci_security_gates.py

      - name: Run Real-Target Validation and Release Readiness Tests
        run: |
          python3 -m unittest tests/test_phase11_real_target_release_readiness.py

      - name: Run Evidence-Driven Investigation Loop and Conversational Validation Tests
        run: |
          python3 -m unittest tests/test_phase12_investigation_loop.py

      - name: Run Phase 13 End-to-End Operational Acceptance Tests
        run: |
          python3 -m unittest tests/test_phase13_operational_acceptance.py

      - name: Run Phase 13 Operational Acceptance Demonstration Script
        run: |
          python3 scripts/run_e2e_operational_acceptance.py

      - name: Run Phase 14 Production Pilot and Release Qualification Tests
        run: |
          python3 -m unittest tests/test_phase14_production_pilot.py

      - name: Run Phase 14 Production Pilot Demonstration Script
        run: |
          python3 scripts/run_production_pilot.py --smoke

      - name: Run All Remaining Tests
        run: |
          python3 -m unittest discover tests

      - name: Run CI Workflow Parity Tests
        run: |
          python3 -m unittest tests/test_ci_workflow_parity.py

      - name: Run Performance Benchmark Smoke Test
        run: |
          python3 -m benchmarks.capture_benchmark --smoke



