        run: |
          python3 -m unittest -v tests/test_deadlock_real_process_baseline.py

      - name: Run All Remaining Tests
        run: |
          python3 -m unittest discover tests

      - name: Record per-file test baseline
        if: always()
        run: |
          scripts/run_test_baseline.sh test-baseline

      - name: Upload test baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-baseline
          path: test-baseline/

      - name: Run CI Workflow Parity Tests
        run: |
